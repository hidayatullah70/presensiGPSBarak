<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Presensi</title>
<style>
  :root{
    /* Standar Palet Warna Perusahaan */
    --primary-red:#BA1D23;      /* Aksen primer, tombol penting, peringatan bahaya */
    --primary-yellow:#F9CE3B;   /* Aksen emas/kuning, highlight bintang/warning */
    --accent-green:#32B23E;     /* Hijau navbar publik, status aktif, border sorotan */
    --ink:#0F172A;              /* Latar hero gelap, teks utama pekat */
    --slate:#334155;            /* Teks sekunder, pembatas */
    --muted:#64748B;            /* Teks placeholder, deskripsi tabel */
    --border:#E2E8F0;           /* Garis batas kartu dan tabel */
    --canvas:#F8FAFC;           /* Latar belakang dashboard internal */
    --surface:#FFFFFF;          /* Latar belakang kartu, modal, dan drawer */
    --info:#2563EB;             /* Biru status informasi */
    --warning:#D97706;          /* Oranye status perhatian/tinjauan */
    --danger:#DC2626;           /* Merah status kedaluwarsa/gagal */
    --success:#16A34A;          /* Hijau status berhasil/disetujui */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input{font:inherit}
  [hidden]{display:none!important}
  header{background:var(--accent-green);color:var(--surface);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header .tombol{background:var(--surface);color:var(--accent-green);border-color:var(--surface)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800}
  .logo i{width:32px;height:32px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--accent-green);font-style:normal;font-weight:900}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .kartu{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
  .masuk{max-width:380px;margin:40px auto}
  input{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink)}
  input:focus{outline:2px solid var(--accent-green);border-color:transparent}
  .tombol{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer;color:var(--slate)}
  .tombol.utama{background:var(--accent-green);color:var(--surface);border-color:var(--accent-green);font-weight:800}
  .alat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .segmen{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
  .segmen button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted)}
  .segmen button.aktif{background:var(--accent-green);color:var(--surface)}
  .ruang{flex:1}
  .angka{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .angka div{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .angka small{color:var(--muted);font-weight:600}
  .angka b{display:block;font-size:26px;color:var(--ink)}
  .angka div:first-child{background:var(--accent-green);color:var(--surface);border-color:var(--accent-green)}
  .angka div:first-child b{color:var(--surface)}
  .angka div:first-child small{color:rgba(255,255,255,0.9);font-weight:700}
  .bungkus{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border)}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--canvas)}
  tr:last-child td{border-bottom:0}
  .st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:#F1F5F9;color:var(--muted)}
  .st.tepat{background:#DCFCE7;color:var(--success)} .st.telat{background:#FEF3C7;color:var(--warning)} .st.absen{background:#FEE2E2;color:var(--danger)}
  a{color:var(--info);font-weight:600;text-decoration:none}
  a:hover{text-decoration:underline}
  .redup{color:var(--muted)}
  @media (max-width:720px){ .angka{grid-template-columns:repeat(2,1fr)} main{padding:14px} .ruang{display:none} }
  @media print{ header .tombol,.alat{display:none} body{background:var(--surface)} }
  .logo-img[hidden]{display:none}.logo-img{height:34px;max-width:120px;object-fit:contain;border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="logo"><img class="logo-img" src="<?= logoUrl ?>" alt="Logo" hidden onload="this.hidden=false;this.nextElementSibling.style.display='none'" onerror="this.remove()"><i><?= logoInisial ?></i><span>Admin Presensi</span></div>
  <button class="tombol" id="btnKeluar" hidden>Keluar</button>
</header>
<main>
  <form class="kartu masuk" id="formKunci">
    <h2 style="margin-top:0">Masuk admin</h2>
    <p class="redup">Masukkan <b>kunci_admin</b> dari sheet Pengaturan.</p>
    <input type="password" id="inKunci" autocomplete="current-password" placeholder="Kunci admin" required style="width:100%">
    <p id="pesan" style="color:var(--merah);min-height:20px"></p>
    <button class="tombol utama" style="width:100%">Buka rekap</button>
  </form>

  <section id="panel" hidden>
    <div class="alat">
      <div class="segmen" id="seg"><button type="button" data-m="hari" class="aktif">Harian</button><button type="button" data-m="bulan">Bulanan</button></div>
      <input type="date" id="inTgl"><input type="month" id="inBln" hidden>
      <span class="ruang"></span>
      <button class="tombol" id="btnCsv">Ekspor CSV</button>
      <button class="tombol" onclick="window.print()">Cetak</button>
    </div>
    <div class="angka" id="angka"></div>
    <div class="bungkus"><table id="tabel"></table></div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px">
      <p class="redup" id="info" style="font-size:13px;margin:0"></p>
      <p class="redup" style="font-size:12px;margin:0">&copy; 2026 PT. Bimasena Adhirajasa Radhika</p>
    </div>
  </section>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KUNCI = '', MODE = 'hari';
  function dua(n){ return (n<10?'0':'')+n; }
  var d = new Date(); $('inTgl').value = d.getFullYear()+'-'+dua(d.getMonth()+1)+'-'+dua(d.getDate()); $('inBln').value = $('inTgl').value.slice(0,7);
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function server(fn,args){ return new Promise(function(ok,no){ var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(e&&e.message||String(e));}); r[fn].apply(r,args); }); }
  function nilai(){ return MODE==='hari' ? $('inTgl').value : $('inBln').value; }
  function kelas(s){ return s==='Tepat Waktu'?'tepat':s==='Telat'?'telat':s==='Belum hadir'?'absen':''; }

  function muat(){
    $('info').textContent = 'Memuat…';
    return server('rekap',[KUNCI, MODE, nilai()]).then(render);
  }
  function render(r){
    var b = r.baris;
    if (r.mode==='hari'){
      var hadir=b.filter(function(x){return x.masuk;}).length, telat=b.filter(function(x){return x.status==='Telat';}).length;
      $('angka').innerHTML='<div><small>Hadir</small><b>'+hadir+'/'+b.length+'</b></div><div><small>Tepat waktu</small><b>'+(hadir-telat)+'</b></div><div><small>Telat</small><b>'+telat+'</b></div><div><small>Belum hadir</small><b>'+(b.length-hadir)+'</b></div>';
      $('tabel').innerHTML='<thead><tr><th>ID</th><th>Nama</th><th>Masuk</th><th>Pulang</th><th>Status</th><th>Telat</th><th>Jarak</th><th>Foto</th></tr></thead><tbody>'+b.map(function(x){
        return '<tr><td>'+esc(x.id)+'</td><td><b>'+esc(x.nama)+'</b><br><span class="redup">'+esc(x.jabatan)+'</span></td><td>'+(x.masuk||'-')+'</td><td>'+(x.pulang||'-')+'</td><td><span class="st '+kelas(x.status)+'">'+esc(x.status)+'</span></td><td>'+(x.telat?x.telat+' mnt':'-')+'</td><td>'+(x.jarak!==''?x.jarak+' m':'-')+'</td><td>'+(x.foto?'<a href="'+esc(x.foto)+'" target="_blank" rel="noopener">Masuk</a>':'')+(x.fotoPulang?' · <a href="'+esc(x.fotoPulang)+'" target="_blank" rel="noopener">Pulang</a>':'')+'</td></tr>';
      }).join('')+'</tbody>';
    } else {
      var tot=b.reduce(function(s,x){return s+x.hadir;},0), tl=b.reduce(function(s,x){return s+x.telat;},0);
      $('angka').innerHTML='<div><small>Total kehadiran</small><b>'+tot+'</b></div><div><small>Tepat waktu</small><b>'+(tot-tl)+'</b></div><div><small>Telat</small><b>'+tl+'</b></div><div><small>Karyawan</small><b>'+b.length+'</b></div>';
      $('tabel').innerHTML='<thead><tr><th>ID</th><th>Nama</th><th>Hadir</th><th>Tepat</th><th>Telat</th><th>Total telat</th><th>Pulang cepat</th></tr></thead><tbody>'+b.map(function(x){
        return '<tr><td>'+esc(x.id)+'</td><td><b>'+esc(x.nama)+'</b><br><span class="redup">'+esc(x.jabatan)+'</span></td><td>'+x.hadir+' hari</td><td>'+x.tepat+'</td><td>'+x.telat+'</td><td>'+x.totalTelat+' mnt</td><td>'+x.pulangCepat+'</td></tr>';
      }).join('')+'</tbody>';
    }
    $('info').textContent = 'Diperbarui '+new Date().toLocaleTimeString('id-ID');
  }

  $('formKunci').onsubmit=function(e){ e.preventDefault(); KUNCI=$('inKunci').value; muat().then(function(){ $('formKunci').hidden=true; $('panel').hidden=false; $('btnKeluar').hidden=false; }).catch(function(er){ $('pesan').textContent=er; }); };
  $('btnKeluar').onclick=function(){
    KUNCI = '';
    $('inKunci').value = '';
    $('pesan').textContent = '';
    $('formKunci').hidden = false;
    $('panel').hidden = true;
    $('btnKeluar').hidden = true;
    setTimeout(function(){ $('inKunci').focus(); }, 100);
  };
  $('seg').onclick=function(e){ var t=e.target.closest('button'); if(!t) return; MODE=t.dataset.m; Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('aktif',x===t);}); $('inTgl').hidden=MODE!=='hari'; $('inBln').hidden=MODE!=='bulan'; muat().catch(alert); };
  $('inTgl').onchange=$('inBln').onchange=function(){ muat().catch(alert); };
  $('btnCsv').onclick=function(){
    server('dataMentah',[KUNCI,MODE,nilai()]).then(function(rows){
      var csv='﻿'+rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\n');
      var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='presensi-'+nilai()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
    }).catch(alert);
  };
})();
</script>
</body>
</html>
